<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三级火塔动态审核</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c272b}canvas{display:block;width:100%;height:100%}.back{position:fixed;top:18px;left:20px;z-index:2;color:#f2dda4;font:14px Microsoft YaHei;text-decoration:none;padding:8px 11px;border:1px solid #b99d6b;border-radius:5px;background:#15363ad9}
</style>
<a class="back" href="index.html">返回游戏</a><canvas id="stage"></canvas>
<script src="art.js"></script>
<script>
const canvas=document.getElementById('stage'),c=canvas.getContext('2d');let w=0,h=0,dpr=1;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;c.setTransform(dpr,0,0,dpr,0,0);w=r.width;h=r.height}addEventListener('resize',resize);resize();
function frame(ms){const t=ms/1000,x=w/2,y=h*.69,size=Math.min(115,w*.105,h*.18);c.clearRect(0,0,w,h);const sky=c.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#0c2b30');sky.addColorStop(1,'#245044');c.fillStyle=sky;c.fillRect(0,0,w,h);c.globalAlpha=.16;for(let i=0;i<90;i++){const px=(Math.sin(i*91.7)*.5+.5)*w,py=(Math.sin(i*i*17.3)*.5+.5)*h;c.fillStyle=i%3?'#91b779':'#d6c38b';c.fillRect(px,py,2,1)}c.globalAlpha=1;c.fillStyle='#788573';c.beginPath();c.ellipse(x,y+size*.49,size*1.55,size*.42,0,0,Math.PI*2);c.fill();c.strokeStyle='#c4c7a0';c.lineWidth=2;c.stroke();ElementArt.fireAuraBack(c,x,y,size,t,3);ElementArt.tower(c,'fire',x,y,size,t,3);ElementArt.fireAuraFront(c,x,y,size,t,3);requestAnimationFrame(frame)}ElementArt.ready.then(()=>requestAnimationFrame(frame));
</script>
</html>
