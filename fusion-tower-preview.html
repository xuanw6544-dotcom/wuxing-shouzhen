<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>融合灵塔 · 灵塔预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#12282d;color:#f4e4bc;font:14px system-ui}canvas{display:block;touch-action:none}header{position:fixed;top:16px;left:20px}h1{font-size:22px;margin:0 0 8px}select{background:#213a3f;color:inherit;font:inherit;padding:8px;border:1px solid #988764;border-radius:4px}a{position:fixed;right:20px;top:22px;color:inherit}footer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:16px;padding:10px 16px;border:1px solid #988764;border-radius:8px;background:#193337ef;max-width:calc(100% - 24px)}label{display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:28px}input{accent-color:#e2b363}input[type=range]{width:95px}</style>
<header><h1>融合灵塔</h1><select id="element" aria-label="融合元素"><option value="thunder">雷霆</option><option value="bog">腐沼</option><option value="spike">锋木</option><option value="mist">风雾</option><option value="lava">熔岩</option><option value="blade">灼刃</option><option value="steam">蒸汽</option><option value="rock">重岩</option><option value="mud">泥浆</option><option value="ice">寒冰</option></select> <select id="level" aria-label="灵塔等级"><option value="all">尺寸对照</option><option value="1">一级尺寸</option><option value="2">二级尺寸</option><option value="3">三级尺寸</option></select></header><a href="./index.html">返回游戏</a><footer><label><input id="motion" type="checkbox" checked>动态</label><label>缩放<input id="zoom" type="range" min=".8" max="1.4" value="1" step=".01"></label></footer>
<script type="module">
import * as THREE from './assets/three.module.js';
import {createFusionTower,animateFusionTower,FUSION_ART} from './fusion-tower-models.js';
const names=Object.fromEntries(Object.entries(FUSION_ART).map(([k,v])=>[k,v.name]));
const requested=new URLSearchParams(location.search).get('element');const kind=names[requested]?requested:'thunder';
document.querySelector('h1').textContent=names[kind];const element=document.querySelector('#element');element.value=kind;element.addEventListener('change',()=>location.search='?element='+element.value);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x12282d);const camera=new THREE.PerspectiveCamera(34,1,.1,40);
scene.add(new THREE.HemisphereLight(0xe0efff,0x26372c,2));const sun=new THREE.DirectionalLight(0xffe4ba,3.2);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const rim=new THREE.DirectionalLight(0x6fb4d8,1.8);rim.position.set(3,3,-4);scene.add(rim);
const platform=new THREE.Mesh(new THREE.BoxGeometry(8.8,.15,3.3),new THREE.MeshStandardMaterial({color:0x294649,roughness:.85}));platform.position.y=-.2;platform.receiveShadow=true;scene.add(platform);
const models=[1,2,3].map(level=>{const m=createFusionTower(kind);m.scale.setScalar([1,1.22,1.42][level-1]);scene.add(m);return m;});
const level=document.querySelector('#level'),motion=document.querySelector('#motion'),zoom=document.querySelector('#zoom');
function select(){models.forEach((m,i)=>{m.visible=level.value==='all'||Number(level.value)===i+1;m.position.x=level.value==='all'?(i-1)*2.65:0;});platform.scale.x=level.value==='all'?1:.4;}level.addEventListener('change',select);select();
let azimuth=.25,elevation=.32,pointer=null,time=0;const clock=new THREE.Clock();
renderer.domElement.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!pointer)return;azimuth-=(e.clientX-pointer.x)*.005;elevation=Math.max(.1,Math.min(1.1,elevation+(e.clientY-pointer.y)*.004));pointer={x:e.clientX,y:e.clientY};});renderer.domElement.addEventListener('lostpointercapture',()=>pointer=null);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}addEventListener('resize',resize);resize();
function frame(){requestAnimationFrame(frame);const dt=Math.min(.1,clock.getDelta());if(motion.checked)time+=dt;const d=Math.max(level.value==='all'?10:7.7,(level.value==='all'?24:7)/camera.aspect)/Number(zoom.value);camera.position.set(Math.sin(azimuth)*Math.cos(elevation)*d,1.4+Math.sin(elevation)*d,Math.cos(azimuth)*Math.cos(elevation)*d);camera.lookAt(0,1.4,0);models.forEach(m=>animateFusionTower(m,time));renderer.render(scene,camera);}frame();
</script></html>
